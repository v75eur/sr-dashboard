<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SR Bot — Contact</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
  <div class="login-box">
    <h1>💬 Contacter l'admin</h1>
    <p class="subtitle">Choisis ton pseudo et écris ton message</p>
    <form id="contactForm">
      <select id="pseudo" required>
        <option value="">-- Choisis ton pseudo --</option>
        {% for pseudo, info in users.items() %}
        <option value="{{ pseudo }}">{{ pseudo }}</option>
        {% endfor %}
      </select>
      <textarea id="texte" rows="5" placeholder="Ton message..." required maxlength="1000"></textarea>
      <button type="submit">📤 Envoyer</button>
    </form>
    <div id="msg"></div>
  </div>

<script>
document.getElementById('contactForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const body = {
    pseudo: document.getElementById('pseudo').value,
    texte:  document.getElementById('texte').value.trim()
  };
  const msg = document.getElementById('msg');
  if (!body.pseudo || !body.texte) return;
  msg.textContent = '⏳ Envoi...';
  msg.style.color = '#00d4ff';
  const r = await fetch('/api/messages', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  });
  const data = await r.json();
  if (data.ok) {
    msg.textContent = '✅ Message envoyé !';
    msg.style.color = '#28c840';
    document.getElementById('contactForm').reset();
  } else {
    msg.textContent = '❌ ' + (data.error || 'Erreur');
    msg.style.color = '#ff5f57';
  }
});
</script>
</body>
</html>
